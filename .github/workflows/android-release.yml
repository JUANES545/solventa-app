name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run static and unit verification
        run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest

      - name: Run navigation smoke tests
        run: ./gradlew ciPhoneApi35DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Sign and publish APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Read and validate version
        shell: bash
        run: |
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' version.properties)"
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid VERSION_CODE"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION_NAME"; exit 1; }
          if gh release view "v${VERSION_NAME}" >/dev/null 2>&1; then
            echo "Release v${VERSION_NAME} already exists. Increment version.properties before updating main."
            exit 1
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Restore release keystore
        shell: bash
        run: |
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "Required signing secret $value is missing."
              exit 1
            fi
          done
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/solventa-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$ANDROID_KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew clean assembleRelease

      - name: Verify and stage APK
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH" || { echo "Signed APK was not generated."; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          "$AAPT" dump badging "$APK_PATH" | grep "versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          mkdir -p dist
          cp "$APK_PATH" dist/solventa.apk
          sha256sum dist/solventa.apk > dist/solventa.apk.sha256

      - name: Preserve signed build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solventa-v${{ env.VERSION_NAME }}
          path: |
            dist/solventa.apk
            dist/solventa.apk.sha256
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        run: |
          gh release create "v${VERSION_NAME}" \
            dist/solventa.apk \
            dist/solventa.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Solventa v${VERSION_NAME}" \
            --generate-notes \
            --latest

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/solventa-release.jks"
